<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171d4a" />
    <meta
      name="description"
      content="Shop India's top stores with worldwide delivery — one cart, your currency, full landed-cost transparency."
    />
    <title>Global Ducan — Shop India, Delivered Anywhere</title>
    <script>
      // Apply saved/system theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('ducan-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
